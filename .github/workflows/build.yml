name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # android folder repo me nahi hai, har baar yahin ban jata hai
      - name: Android folder generate karo
        run: |
          flutter create --platforms=android --project-name assistant_app tmp_app
          cp -r tmp_app/android ./android
          rm -rf tmp_app
          # Internet permission (release build me zaroori)
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
